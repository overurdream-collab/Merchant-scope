name: MerchantScope CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test Python API
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app
      - name: Validate Arabic dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("app/dashboard.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", page, re.S)
          assert match, "Missing dashboard script"
          Path("/tmp/merchantscope-dashboard.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/merchantscope-dashboard.js

  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Browser end-to-end smoke (synthetic data)
        run: python tests/browser_smoke.py

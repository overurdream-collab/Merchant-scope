name: MerchantScope PostgreSQL RLS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merchantscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merchantscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest "psycopg[binary]>=3.2,<4"
      - run: python -m pytest -q tests/test_pg_schema.py

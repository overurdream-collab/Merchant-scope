name: MerchantScope PostgreSQL RLS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merchantscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merchantscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt "psycopg[binary]>=3.2,<4"
      - run: python -m pytest -q tests/test_pg_schema.py
      - name: Install browser acceptance tooling
        run: |
          pip install "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Secure PostgreSQL UI end-to-end smoke
        env:
          MERCHANTSCOPE_SCREENSHOT_DIR: secure-ui-artifacts
        run: python tests/pg_browser_smoke.py
      - name: Rehearse PostgreSQL backup and restore into separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          service="${{ job.services.postgres.id }}"
          echo "Backing up disposable CI research data only; no live databases."
          docker exec "$service" pg_dump -U postgres -d merchantscope_test -n ms -Fc > "$RUNNER_TEMP/merchantscope-ci.dump"
          test -s "$RUNNER_TEMP/merchantscope-ci.dump"
          docker exec "$service" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE merchantscope_restore'
          docker exec -i "$service" pg_restore --exit-on-error --no-owner -U postgres -d merchantscope_restore < "$RUNNER_TEMP/merchantscope-ci.dump"
          for table in organizations merchants research_candidates evidence recommendations audit_events; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "SELECT count(*) FROM ms.$table")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT count(*) FROM ms.$table")"
            test "$before" = "$after" || { echo "Restore mismatch: $table"; exit 1; }
            echo "Restored $table: $after records"
          done
          # Compare every user table and every RLS policy, not just a single table.
          # A restored database can have identical rows while silently losing a policy.
          table_query="SELECT string_agg(format('%I', tablename), ',' ORDER BY tablename) FROM pg_tables WHERE schemaname='ms'"
          source_tables="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$table_query")"
          restored_tables="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$table_query")"
          test -n "$source_tables" && test "$source_tables" = "$restored_tables" || { echo "Restored table inventory differs"; exit 1; }
          for table in ${source_tables//,/ }; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "SELECT count(*) FROM ms.$table")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT count(*) FROM ms.$table")"
            test "$before" = "$after" || { echo "Restore mismatch: $table"; exit 1; }
          done
          # Counts alone cannot detect corruption when a row is changed but not removed.
          # Compare canonical JSONB row digests across every restored table.
          for table in ${source_tables//,/ }; do
            digest_sql="SELECT md5(coalesce(string_agg(to_jsonb(t)::text, '|' ORDER BY to_jsonb(t)::text), '')) FROM ms.$table AS t"
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$digest_sql")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$digest_sql")"
            test "$before" = "$after" || { echo "Restore row-content mismatch: $table"; exit 1; }
          done
          rls_query="SELECT string_agg(format('%s:%s:%s', c.relname, c.relrowsecurity, c.relforcerowsecurity), ',' ORDER BY c.relname) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p')"
          policy_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s', tablename, policyname, permissive, roles::text, cmd, coalesce(qual,''), coalesce(with_check,'')), E'\\n' ORDER BY tablename, policyname), '') FROM pg_policies WHERE schemaname='ms'"
          for query in "$rls_query" "$policy_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "Restored RLS configuration or policies differ"; exit 1; }
          done
          # Restore must preserve column definitions, constraints and indexes as well as data.
          # Compare catalog definitions in deterministic order; avoid relying on row counts.
          column_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s:%s:%s:%s', c.table_name, c.column_name, c.ordinal_position, c.data_type, coalesce(c.udt_name,''), c.is_nullable, coalesce(c.column_default,''), coalesce(c.is_identity,''), coalesce(c.identity_generation,''), coalesce(c.generation_expression,'')), E'\\n' ORDER BY c.table_name, c.ordinal_position), '') FROM information_schema.columns c WHERE c.table_schema='ms'"
          constraint_query="SELECT coalesce(string_agg(format('%s:%s:%s', con.conrelid::regclass::text, con.conname, pg_get_constraintdef(con.oid)), E'\\n' ORDER BY con.conrelid::regclass::text, con.conname), '') FROM pg_constraint con JOIN pg_namespace ns ON ns.oid=con.connamespace WHERE ns.nspname='ms'"
          index_query="SELECT coalesce(string_agg(format('%s:%s', tablename, indexdef), E'\\n' ORDER BY tablename, indexname), '') FROM pg_indexes WHERE schemaname='ms'"
          trigger_query="SELECT coalesce(string_agg(format('%s:%s', c.relname, pg_get_triggerdef(t.oid)), E'\\n' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal"
          for query in "$column_query" "$constraint_query" "$index_query" "$trigger_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "Restored schema columns/defaults, constraints, indexes or triggers differ"; exit 1; }
          done
          # Audit and authorization may depend on SQL functions, which earlier comparisons omitted.
          # Compare function signatures, definitions and execution-security flags after restore.
          function_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s', p.proname, pg_get_function_identity_arguments(p.oid), pg_get_function_result(p.oid), p.prosecdef, p.provolatile, pg_get_functiondef(p.oid)), E'\\\\n' ORDER BY p.proname, pg_get_function_identity_arguments(p.oid)), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prokind IN ('f','p')"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$function_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$function_query")"
          test "$before" = "$after" || { echo "Restored SQL function definitions or security flags differ"; exit 1; }
          # Restored rows can match while sequences silently restart, causing duplicate IDs.
          # Verify sequence inventory and durable state (last_value/is_called) across databases.
          sequence_query="SELECT coalesce(string_agg(format('%I', sequencename), ',' ORDER BY sequencename), '') FROM pg_sequences WHERE schemaname='ms'"
          source_sequences="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$sequence_query")"
          restored_sequences="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$sequence_query")"
          test "$source_sequences" = "$restored_sequences" || { echo "Restore sequence inventory mismatch"; exit 1; }
          if [ -n "$source_sequences" ]; then
            for sequence in ${source_sequences//,/ }; do
              sequence_state_sql="SELECT last_value::text || ':' || is_called::text FROM ms.$sequence"
              before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$sequence_state_sql")"
              after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$sequence_state_sql")"
              test "$before" = "$after" || { echo "Restore sequence state mismatch: $sequence"; exit 1; }
            done
          fi
          # Object ACLs can drift even when schema definitions and RLS policies match.
          # Compare effective grants, not raw relacl text: PostgreSQL represents
          # owner-only privileges as either NULL (defaults) or explicit ACL entries.
          # The same effective grants must compare equal in either representation.
          # Compare schema, relation/sequence and routine grants after restoration.
          schema_acl_query="SELECT coalesce(nspacl::text, '<default>') FROM pg_namespace WHERE nspname='ms'"
          relation_acl_query="SELECT coalesce(string_agg(format('%s:%s:%s', c.relname, c.relkind, (SELECT coalesce(string_agg(format('%s:%s:%s:%s', CASE WHEN a.grantee=0 THEN 'PUBLIC' ELSE pg_get_userbyid(a.grantee) END, a.privilege_type, a.is_grantable, pg_get_userbyid(a.grantor)), ',' ORDER BY a.grantee, a.privilege_type, a.is_grantable, a.grantor), '') FROM aclexplode(coalesce(c.relacl, CASE WHEN c.relkind='S' THEN acldefault('S'::\"char\", c.relowner) ELSE acldefault('r'::\"char\", c.relowner) END)) a)), E'\\n' ORDER BY c.relname, c.relkind), '') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p','v','m','S','f')"
          routine_acl_query="SELECT coalesce(string_agg(format('%s:%s:%s', p.proname, pg_get_function_identity_arguments(p.oid), coalesce(p.proacl::text, '<default>')), E'\\n' ORDER BY p.proname, pg_get_function_identity_arguments(p.oid)), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms'"
          for query in "$schema_acl_query" "$relation_acl_query" "$routine_acl_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "SECURITY FAILURE: restored schema/object ACL mismatch"; echo "ACL query: $query"; printf "SOURCE ACL:\n%s\nRESTORED ACL:\n%s\n" "$before" "$after"; exit 1; }
          done
          # SECURITY DEFINER authentication functions must never regain PUBLIC EXECUTE.
          # --no-acl on restore would silently restore PostgreSQL's default PUBLIC EXECUTE.
          privilege_query="SELECT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace CROSS JOIN LATERAL aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) acl WHERE n.nspname='ms' AND p.proname IN ('login_account','lookup_session') AND acl.grantee=0 AND acl.privilege_type='EXECUTE')"
          for database in merchantscope_test merchantscope_restore; do
            exposed="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$privilege_query")"
            test "$exposed" = "f" || { echo "SECURITY FAILURE: public authentication function EXECUTE in $database"; exit 1; }
            granted="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "SELECT has_function_privilege('merchant_auth', 'ms.login_account(text,uuid)', 'EXECUTE') AND has_function_privilege('merchant_auth', 'ms.lookup_session(bytea)', 'EXECUTE')")"
            test "$granted" = "t" || { echo "SECURITY FAILURE: merchant_auth grants missing in $database"; exit 1; }
            # The application runtime must not inherit privileged authentication routines.
            # Check effective privileges (including role inheritance), not only explicit ACL rows.
            runtime_denied="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "SELECT NOT has_function_privilege('merchant_runtime', 'ms.login_account(text,uuid)', 'EXECUTE') AND NOT has_function_privilege('merchant_runtime', 'ms.lookup_session(bytea)', 'EXECUTE')")"
            test "$runtime_denied" = "t" || { echo "SECURITY FAILURE: merchant_runtime can execute auth functions in $database"; exit 1; }
            public_denied="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "SELECT NOT has_function_privilege('public', 'ms.login_account(text,uuid)', 'EXECUTE') AND NOT has_function_privilege('public', 'ms.lookup_session(bytea)', 'EXECUTE')")"
            test "$public_denied" = "t" || { echo "SECURITY FAILURE: PUBLIC can execute auth functions in $database"; exit 1; }
          done
          security="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT relrowsecurity FROM pg_class WHERE oid='ms.research_candidates'::regclass")"
          test "$security" = "t" || { echo "Candidate RLS absent after restore"; exit 1; }
          echo "SUCCESS: disposable tables, rows, column defaults, constraints, indexes, triggers, RLS flags and policies restored."

      - name: Upload secure synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchantscope-secure-ui
          path: secure-ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7

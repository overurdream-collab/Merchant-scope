name: MerchantScope PostgreSQL RLS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merchantscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merchantscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt "psycopg[binary]>=3.2,<4"
      - run: python -m pytest -q tests/test_pg_schema.py
      - name: Install browser acceptance tooling
        run: |
          pip install "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Secure PostgreSQL UI end-to-end smoke
        env:
          MERCHANTSCOPE_SCREENSHOT_DIR: secure-ui-artifacts
        run: python tests/pg_browser_smoke.py
      - name: Upload secure synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchantscope-secure-ui
          path: secure-ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7

name: MerchantScope PostgreSQL RLS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: merchantscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merchantscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt "psycopg[binary]>=3.2,<4"
      - run: python -m pytest -q tests/test_pg_schema.py tests/test_pg_security_definer.py tests/test_pg_schema_ownership.py
      - name: Install browser acceptance tooling
        run: |
          pip install "playwright>=1.51,<2"
          python -m playwright install --with-deps chromium
      - name: Secure PostgreSQL UI end-to-end smoke
        env:
          MERCHANTSCOPE_SCREENSHOT_DIR: secure-ui-artifacts
        run: python tests/pg_browser_smoke.py
      - name: Verify core tenant RLS and policy baseline on source database
        run: python -m pytest -q tests/test_pg_restore_rls_baseline.py
      - name: Rehearse PostgreSQL backup and restore into separate disposable database
        shell: bash
        run: |
          set -euo pipefail
          service="${{ job.services.postgres.id }}"
          echo "Backing up disposable CI research data only; no live databases."
          docker exec "$service" pg_dump -U postgres -d merchantscope_test -n ms -Fc > "$RUNNER_TEMP/merchantscope-ci.dump"
          test -s "$RUNNER_TEMP/merchantscope-ci.dump"
          docker exec "$service" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE merchantscope_restore'
          docker exec -i "$service" pg_restore --exit-on-error --no-owner -U postgres -d merchantscope_restore < "$RUNNER_TEMP/merchantscope-ci.dump"
          for table in organizations merchants research_candidates evidence recommendations audit_events; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "SELECT count(*) FROM ms.$table")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT count(*) FROM ms.$table")"
            test "$before" = "$after" || { echo "Restore mismatch: $table"; exit 1; }
            echo "Restored $table: $after records"
          done
          # Compare every user table and every RLS policy, not just a single table.
          # A restored database can have identical rows while silently losing a policy.
          table_query="SELECT string_agg(format('%I', tablename), ',' ORDER BY tablename) FROM pg_tables WHERE schemaname='ms'"
          source_tables="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$table_query")"
          restored_tables="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$table_query")"
          test -n "$source_tables" && test "$source_tables" = "$restored_tables" || { echo "Restored table inventory differs"; exit 1; }
          for table in ${source_tables//,/ }; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "SELECT count(*) FROM ms.$table")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT count(*) FROM ms.$table")"
            test "$before" = "$after" || { echo "Restore mismatch: $table"; exit 1; }
          done
          # Counts alone cannot detect corruption when a row is changed but not removed.
          # Compare canonical JSONB row digests across every restored table.
          for table in ${source_tables//,/ }; do
            digest_sql="SELECT md5(coalesce(string_agg(to_jsonb(t)::text, '|' ORDER BY to_jsonb(t)::text), '')) FROM ms.$table AS t"
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$digest_sql")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$digest_sql")"
            test "$before" = "$after" || { echo "Restore row-content mismatch: $table"; exit 1; }
          done
          rls_query="SELECT string_agg(format('%s:%s:%s', c.relname, c.relrowsecurity, c.relforcerowsecurity), ',' ORDER BY c.relname) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p')"
          policy_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s', tablename, policyname, permissive, roles::text, cmd, coalesce(qual,''), coalesce(with_check,'')), E'\\n' ORDER BY tablename, policyname), '') FROM pg_policies WHERE schemaname='ms'"
          for query in "$rls_query" "$policy_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "Restored RLS configuration or policies differ"; exit 1; }
          done
          # Restore must preserve column definitions, constraints and indexes as well as data.
          # Compare catalog definitions in deterministic order; avoid relying on row counts.
          column_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s:%s:%s:%s', c.table_name, c.column_name, c.ordinal_position, c.data_type, coalesce(c.udt_name,''), c.is_nullable, coalesce(c.column_default,''), coalesce(c.is_identity,''), coalesce(c.identity_generation,''), coalesce(c.generation_expression,'')), E'\\n' ORDER BY c.table_name, c.ordinal_position), '') FROM information_schema.columns c WHERE c.table_schema='ms'"
          constraint_query="SELECT coalesce(string_agg(format('%s:%s:%s', con.conrelid::regclass::text, con.conname, pg_get_constraintdef(con.oid)), E'\\n' ORDER BY con.conrelid::regclass::text, con.conname), '') FROM pg_constraint con JOIN pg_namespace ns ON ns.oid=con.connamespace WHERE ns.nspname='ms'"
          index_query="SELECT coalesce(string_agg(format('%s:%s', tablename, indexdef), E'\\n' ORDER BY tablename, indexname), '') FROM pg_indexes WHERE schemaname='ms'"
          trigger_query="SELECT coalesce(string_agg(format('%s:%s', c.relname, pg_get_triggerdef(t.oid)), E'\\n' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal"
          for query in "$column_query" "$constraint_query" "$index_query" "$trigger_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "Restored schema columns/defaults, constraints, indexes or triggers differ"; exit 1; }
          done
          # Trigger definitions do not encode tgenabled: a disabled audit or guard
          # trigger can have an identical pg_get_triggerdef while enforcement stops.
          trigger_state_query="SELECT coalesce(string_agg(format('%s:%s:%s', c.relname, t.tgname, t.tgenabled), E'\\n' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$trigger_state_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$trigger_state_query")"
          test "$before" = "$after" || { echo "SECURITY FAILURE: restored audit/guard trigger enabled state differs"; exit 1; }
          # Parity is not enforcement: a disabled source trigger restored identically
          # would pass the comparison above. Reject any disabled audit/guard trigger
          # in BOTH disposable databases (O = enabled for ordinary origin writes).
          disabled_trigger_query="SELECT coalesce(string_agg(format('%s.%s:%s', c.relname, t.tgname, t.tgenabled), ',' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND (t.tgname LIKE 'audit_%' OR t.tgname IN ('recommendations_guard','leads_guard','candidate_guard')) AND t.tgenabled <> 'O'"
          for database in merchantscope_test merchantscope_restore; do
            disabled="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$disabled_trigger_query")"
            test -z "$disabled" || { echo "SECURITY FAILURE: audit/guard triggers not enabled in $database: $disabled"; exit 1; }
          done
          # An empty disabled-trigger result also passes if a required guard was dropped
          # from both databases. Assert the migration-defined guard inventory separately.
          required_guard_query="SELECT coalesce(string_agg(t.tgname, ',' ORDER BY t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND t.tgname IN ('recommendations_guard','leads_guard','candidate_guard')"
          for database in merchantscope_test merchantscope_restore; do
            guards="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$required_guard_query")"
            test "$guards" = "candidate_guard,leads_guard,recommendations_guard" || { echo "SECURITY FAILURE: required guard trigger missing in $database: $guards"; exit 1; }
          done
          # A guard with the right name but attached to the wrong table leaves the
          # protected table unguarded. Assert exact table-to-trigger bindings in
          # both databases, independently of restore parity.
          guard_binding_query="SELECT coalesce(string_agg(c.relname || ':' || t.tgname, ',' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND t.tgname IN ('recommendations_guard','leads_guard','candidate_guard')"
          expected_guard_bindings="leads:leads_guard,recommendations:recommendations_guard,research_candidates:candidate_guard"
          for database in merchantscope_test merchantscope_restore; do
            bindings="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$guard_binding_query")"
            test "$bindings" = "$expected_guard_bindings" || { echo "SECURITY FAILURE: guard trigger table bindings drift in $database: $bindings"; exit 1; }
          done
          # A matching restore can still omit audit triggers in BOTH databases.
          # Require each migration-defined audit trigger on its intended table.
          audit_binding_query="SELECT coalesce(string_agg(c.relname || ':' || t.tgname, ',' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND t.tgname LIKE 'audit_%'"
          expected_audit_bindings="assessments:audit_assessments,channels:audit_channels,evidence:audit_evidence,leads:audit_leads,merchants:audit_merchants,recommendation_evidence:audit_recommendation_evidence,recommendations:audit_recommendations,research_candidates:audit_candidates"
          for database in merchantscope_test merchantscope_restore; do
            bindings="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$audit_binding_query")"
            test "$bindings" = "$expected_audit_bindings" || { echo "SECURITY FAILURE: required audit trigger bindings drift in $database: $bindings"; exit 1; }
          done
          # Trigger name, binding and enabled state do not prove that the trigger
          # still fires on the intended DML events. PostgreSQL tgtype encodes
          # row-level (1), BEFORE (2), INSERT (4), DELETE (8), UPDATE (16).
          # Audit triggers are AFTER ROW INSERT/UPDATE/DELETE (29), except
          # candidate audit (AFTER ROW INSERT/UPDATE = 21). Guards are
          # BEFORE ROW INSERT/UPDATE (23). Check both source and restore.
          trigger_events_query="SELECT coalesce(string_agg(c.relname || ':' || t.tgname || ':' || t.tgtype::text, ',' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND (t.tgname LIKE 'audit_%' OR t.tgname IN ('recommendations_guard','leads_guard','candidate_guard'))"
          expected_trigger_events="assessments:audit_assessments:29,channels:audit_channels:29,evidence:audit_evidence:29,leads:audit_leads:29,leads:leads_guard:23,merchants:audit_merchants:29,recommendation_evidence:audit_recommendation_evidence:29,recommendations:audit_recommendations:29,recommendations:recommendations_guard:23,research_candidates:audit_candidates:21,research_candidates:candidate_guard:23"
          for database in merchantscope_test merchantscope_restore; do
            events="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$trigger_events_query")"
            test "$events" = "$expected_trigger_events" || { echo "SECURITY FAILURE: audit/guard DML event coverage drift in $database: $events"; exit 1; }
          done
          # A restored schema may lose or alter a view without changing any base-table rows.
          # Compare both ordinary and materialized view definitions, including an empty inventory.
          view_query="SELECT coalesce(string_agg(format('%s:%s:%s', c.relname, c.relkind, pg_get_viewdef(c.oid, true)), E'\\n' ORDER BY c.relname, c.relkind), '') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('v','m')"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$view_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$view_query")"
          test "$before" = "$after" || { echo "Restore view definition or inventory mismatch"; exit 1; }
          # Audit and authorization may depend on SQL functions, which earlier comparisons omitted.
          # Compare function signatures, definitions, execution-security flags and per-function\n          # configuration (including SECURITY DEFINER search_path) after restore.
          function_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s', p.proname, pg_get_function_identity_arguments(p.oid), pg_get_function_result(p.oid), p.prosecdef, p.provolatile, coalesce(array_to_string(p.proconfig, ','), '<default>'), pg_get_functiondef(p.oid)), E'\\\\n' ORDER BY p.proname, pg_get_function_identity_arguments(p.oid)), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prokind IN ('f','p')"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$function_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$function_query")"
          test "$before" = "$after" || { echo "Restored SQL function definitions or security flags differ"; exit 1; }
          # Restored rows can match while sequences silently restart, causing duplicate IDs.
          # Verify sequence inventory and durable state (last_value/is_called) across databases.
          sequence_query="SELECT coalesce(string_agg(format('%I', sequencename), ',' ORDER BY sequencename), '') FROM pg_sequences WHERE schemaname='ms'"
          source_sequences="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$sequence_query")"
          restored_sequences="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$sequence_query")"
          test "$source_sequences" = "$restored_sequences" || { echo "Restore sequence inventory mismatch"; exit 1; }
          if [ -n "$source_sequences" ]; then
            for sequence in ${source_sequences//,/ }; do
              sequence_state_sql="SELECT last_value::text || ':' || is_called::text FROM ms.$sequence"
              before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$sequence_state_sql")"
              after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$sequence_state_sql")"
              test "$before" = "$after" || { echo "Restore sequence state mismatch: $sequence"; exit 1; }
            done
          fi
          # Owners are security principals: matching ACLs and SQL bodies do not
          # guarantee a safe restore when a SECURITY DEFINER function or table
          # has changed owner. Compare schema, relations and routines by role name.
          owner_query="SELECT coalesce(string_agg(object_type || ':' || object_name || ':' || owner_name, E'\\n' ORDER BY object_type, object_name), '') FROM (SELECT 'schema'::text AS object_type, n.nspname::text AS object_name, pg_get_userbyid(n.nspowner)::text AS owner_name FROM pg_namespace n WHERE n.nspname='ms' UNION ALL SELECT 'relation', c.relname || ':' || c.relkind::text, pg_get_userbyid(c.relowner) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' UNION ALL SELECT 'routine', p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')', pg_get_userbyid(p.proowner) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms') owned"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$owner_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$owner_query")"
          test "$before" = "$after" || { echo "SECURITY FAILURE: restored schema, relation or routine ownership differs"; exit 1; }
          # Object ACLs can drift even when schema definitions and RLS policies match.
          # Compare effective grants, not raw relacl text: PostgreSQL represents
          # owner-only privileges as either NULL (defaults) or explicit ACL entries.
          # The same effective grants must compare equal in either representation.
          # Compare schema, relation/sequence and routine grants after restoration.
          schema_acl_query="SELECT coalesce((SELECT string_agg(format('%s:%s:%s:%s', CASE WHEN a.grantee=0 THEN 'PUBLIC' ELSE pg_get_userbyid(a.grantee) END, a.privilege_type, a.is_grantable, pg_get_userbyid(a.grantor)), ',' ORDER BY a.grantee, a.privilege_type, a.is_grantable, a.grantor) FROM aclexplode(coalesce(n.nspacl, acldefault('n'::\"char\", n.nspowner))) a), '') FROM pg_namespace n WHERE n.nspname='ms'"
          relation_acl_query="SELECT coalesce(string_agg(format('%s:%s:%s', c.relname, c.relkind, (SELECT coalesce(string_agg(format('%s:%s:%s:%s', CASE WHEN a.grantee=0 THEN 'PUBLIC' ELSE pg_get_userbyid(a.grantee) END, a.privilege_type, a.is_grantable, pg_get_userbyid(a.grantor)), ',' ORDER BY a.grantee, a.privilege_type, a.is_grantable, a.grantor), '') FROM aclexplode(coalesce(c.relacl, CASE WHEN c.relkind='S' THEN acldefault('S'::\"char\", c.relowner) ELSE acldefault('r'::\"char\", c.relowner) END)) a)), E'\\n' ORDER BY c.relname, c.relkind), '') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p','v','m','S','f')"
          # Normalize routine ACLs too: NULL/default and explicit equivalent grants must compare equally.
          routine_acl_query="SELECT coalesce(string_agg(format('%s:%s:%s', p.proname, pg_get_function_identity_arguments(p.oid), (SELECT coalesce(string_agg(format('%s:%s:%s:%s', CASE WHEN a.grantee=0 THEN 'PUBLIC' ELSE pg_get_userbyid(a.grantee) END, a.privilege_type, a.is_grantable, pg_get_userbyid(a.grantor)), ',' ORDER BY a.grantee, a.privilege_type, a.is_grantable, a.grantor), '') FROM aclexplode(coalesce(p.proacl, acldefault('f'::\"char\", p.proowner))) a)), E'\\n' ORDER BY p.proname, pg_get_function_identity_arguments(p.oid)), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms'"
          for query in "$schema_acl_query" "$relation_acl_query" "$routine_acl_query"; do
            before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$query")"
            after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$query")"
            test "$before" = "$after" || { echo "SECURITY FAILURE: restored schema/object ACL mismatch"; echo "ACL query: $query"; printf "SOURCE ACL:\n%s\nRESTORED ACL:\n%s\n" "$before" "$after"; exit 1; }
          done
          # Default privileges govern FUTURE objects and are not represented by
          # existing table/function ACL comparisons. Preserve them across restore.
          default_acl_query="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s', pg_get_userbyid(d.defaclrole), coalesce(n.nspname,'<global>'), d.defaclobjtype, CASE WHEN a.grantee=0 THEN 'PUBLIC' ELSE pg_get_userbyid(a.grantee) END, a.privilege_type, a.is_grantable, pg_get_userbyid(a.grantor)), E'\\n' ORDER BY d.defaclrole, n.nspname NULLS FIRST, d.defaclobjtype, a.grantee, a.privilege_type, a.is_grantable, a.grantor), '') FROM pg_default_acl d LEFT JOIN pg_namespace n ON n.oid=d.defaclnamespace CROSS JOIN LATERAL aclexplode(d.defaclacl) a WHERE n.nspname='ms' OR d.defaclnamespace=0"
          before="$(docker exec "$service" psql -X -U postgres -d merchantscope_test -Atc "$default_acl_query")"
          after="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "$default_acl_query")"
          test "$before" = "$after" || { echo "SECURITY FAILURE: restored default privileges differ"; exit 1; }
          # SECURITY DEFINER authentication functions must never regain PUBLIC EXECUTE.
          # --no-acl on restore would silently restore PostgreSQL's default PUBLIC EXECUTE.
          privilege_query="SELECT EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace CROSS JOIN LATERAL aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) acl WHERE n.nspname='ms' AND p.proname IN ('login_account','lookup_session') AND acl.grantee=0 AND acl.privilege_type='EXECUTE')"
          for database in merchantscope_test merchantscope_restore; do
            exposed="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$privilege_query")"
            test "$exposed" = "f" || { echo "SECURITY FAILURE: public authentication function EXECUTE in $database"; exit 1; }
            granted="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "SELECT has_function_privilege('merchant_auth', 'ms.login_account(text,uuid)', 'EXECUTE') AND has_function_privilege('merchant_auth', 'ms.lookup_session(bytea)', 'EXECUTE')")"
            test "$granted" = "t" || { echo "SECURITY FAILURE: merchant_auth grants missing in $database"; exit 1; }
            # The application runtime must not inherit privileged authentication routines.
            # Check effective privileges (including role inheritance), not only explicit ACL rows.
            runtime_denied="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "SELECT NOT has_function_privilege('merchant_runtime', 'ms.login_account(text,uuid)', 'EXECUTE') AND NOT has_function_privilege('merchant_runtime', 'ms.lookup_session(bytea)', 'EXECUTE')")"
            test "$runtime_denied" = "t" || { echo "SECURITY FAILURE: merchant_runtime can execute auth functions in $database"; exit 1; }
          done
          # Apply the same catalog-wide SECURITY DEFINER guard to the restored database.
          # Testing only the two auth functions would miss a newly introduced
          # privileged routine that regained PUBLIC or runtime EXECUTE on restore.
          definer_acl_query="SELECT coalesce(string_agg(p.oid::regprocedure::text, ',' ORDER BY p.oid::regprocedure::text), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prosecdef AND EXISTS (SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f',p.proowner))) acl WHERE acl.grantee=0 AND acl.privilege_type='EXECUTE')"
          definer_runtime_query="SELECT coalesce(string_agg(p.oid::regprocedure::text, ',' ORDER BY p.oid::regprocedure::text), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prosecdef AND has_function_privilege('merchant_runtime',p.oid,'EXECUTE')"
          for database in merchantscope_test merchantscope_restore; do
            public_exposed="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$definer_acl_query")"
            test -z "$public_exposed" || { echo "SECURITY FAILURE: PUBLIC SECURITY DEFINER access in $database: $public_exposed"; exit 1; }
            runtime_exposed="$(docker exec "$service" psql -X -U postgres -d "$database" -Atc "$definer_runtime_query")"
            test "$runtime_exposed" = "ms.has_role(ms.member_role),ms.is_member()" || { echo "SECURITY FAILURE: runtime SECURITY DEFINER allowlist drift in $database: $runtime_exposed"; exit 1; }
          done
          security="$(docker exec "$service" psql -X -U postgres -d merchantscope_restore -Atc "SELECT relrowsecurity FROM pg_class WHERE oid='ms.research_candidates'::regclass")"
          test "$security" = "t" || { echo "Candidate RLS absent after restore"; exit 1; }
          echo "SUCCESS: disposable tables, rows, column defaults, constraints, indexes, triggers, RLS flags and policies restored."

      - name: Verify core tenant RLS and policy baseline on restored database
        # Read-only: do not rerun migrations, which could conceal restore defects.
        env:
          PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_restore
        run: python -m pytest -q tests/test_pg_restore_rls_baseline.py

      - name: Validate restored SECURITY DEFINER routines with live role checks
        # Catalog parity alone is insufficient: execute the negative permission
        # and pinned search_path tests against the independent restored database.
        env:
          PG_TEST_DSN: postgresql://postgres:test-password@localhost:5432/merchantscope_restore
        run: python -m pytest -q tests/test_pg_security_definer.py tests/test_pg_schema_ownership.py

      - name: Rehearse restore on independent PostgreSQL cluster with global roles
        shell: bash
        run: |
          set -euo pipefail
          source_container="${{ job.services.postgres.id }}"
          target_container="merchantscope-independent-restore"
          trap 'docker rm -f "$target_container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$target_container" -e POSTGRES_PASSWORD=test-password -e POSTGRES_DB=merchantscope_restore postgres:16
          for attempt in $(seq 1 40); do
            if docker exec "$target_container" pg_isready -U postgres -d merchantscope_restore >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$target_container" pg_isready -U postgres -d merchantscope_restore
          # pg_dump -n ms omits cluster-global roles. Restore them separately
          # on the fresh cluster, without retaining any archive as an artifact.
          docker exec "$source_container" pg_dumpall -U postgres --globals-only > "$RUNNER_TEMP/ci-globals.sql"
          # The destination bootstrap already creates postgres; avoid duplicate CREATE ROLE.
          sed '/^CREATE ROLE postgres;$/d' "$RUNNER_TEMP/ci-globals.sql" |
            docker exec -i "$target_container" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec "$source_container" pg_dump -U postgres -d merchantscope_test -n ms -Fc > "$RUNNER_TEMP/ci-independent.dump"
          docker exec -i "$target_container" pg_restore --exit-on-error -U postgres -d merchantscope_restore < "$RUNNER_TEMP/ci-independent.dump"
          # A fresh cluster can preserve roles and policies while silently losing
          # tenant rows. Compare the complete source/target table inventory and
          # canonical row content, not just a single RLS flag.
          inventory_sql="SELECT coalesce(string_agg(tablename, ',' ORDER BY tablename), '') FROM pg_tables WHERE schemaname='ms'"
          source_inventory="$(docker exec "$source_container" psql -X -U postgres -d merchantscope_test -Atc "$inventory_sql")"
          target_inventory="$(docker exec "$target_container" psql -X -U postgres -d merchantscope_restore -Atc "$inventory_sql")"
          test -n "$source_inventory" && test "$source_inventory" = "$target_inventory" || { echo "SECURITY FAILURE: independent cluster table inventory differs"; exit 1; }
          IFS=',' read -ra restored_tables <<< "$source_inventory"
          for table in "${restored_tables[@]}"; do
            digest_sql="SELECT md5(coalesce(string_agg(to_jsonb(t)::text, '|' ORDER BY to_jsonb(t)::text), '')) FROM ms.$table AS t"
            source_digest="$(docker exec "$source_container" psql -X -U postgres -d merchantscope_test -Atc "$digest_sql")"
            target_digest="$(docker exec "$target_container" psql -X -U postgres -d merchantscope_restore -Atc "$digest_sql")"
            test "$source_digest" = "$target_digest" || { echo "SECURITY FAILURE: independent cluster row digest differs: $table"; exit 1; }
          done
          # A row-perfect restore can still silently lose tenant policies or RLS
          # on tables other than research_candidates. Compare the full catalog
          # across independent clusters and fail if any tenant table lacks RLS.
          tenant_rls_sql="SELECT coalesce(string_agg(c.relname || ':' || c.relrowsecurity::text || ':' || c.relforcerowsecurity::text, ',' ORDER BY c.relname), '') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p')"
          tenant_policies_sql="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s:%s:%s', tablename, policyname, permissive, roles::text, cmd, coalesce(qual,''), coalesce(with_check,'')), E'\\n' ORDER BY tablename, policyname), '') FROM pg_policies WHERE schemaname='ms'"
          for sql in "$tenant_rls_sql" "$tenant_policies_sql"; do
            source_catalog="$(docker exec "$source_container" psql -X -U postgres -d merchantscope_test -Atc "$sql")"
            target_catalog="$(docker exec "$target_container" psql -X -U postgres -d merchantscope_restore -Atc "$sql")"
            test -n "$source_catalog" && test "$source_catalog" = "$target_catalog" || { echo "SECURITY FAILURE: independent cluster tenant RLS/policy catalog differs"; exit 1; }
          done
          # Matching catalogs are not proof of safety: a source with RLS disabled
          # would restore the same insecure configuration and pass parity.
          # Reject disabled RLS on BOTH independent clusters, not just the target.
          disabled_rls_sql="SELECT coalesce(string_agg(c.relname, ',' ORDER BY c.relname), '') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity"
          for cluster_db in "$source_container:merchantscope_test" "$target_container:merchantscope_restore"; do
            IFS=: read -r cluster database <<< "$cluster_db"
            disabled_rls="$(docker exec "$cluster" psql -X -U postgres -d "$database" -Atc "$disabled_rls_sql")"
            test -z "$disabled_rls" || { echo "SECURITY FAILURE: tenant tables without RLS in $database: $disabled_rls"; exit 1; }
          done
          # Role memberships are cluster-global, absent from schema-only pg_dump.
          # Compare membership grants after pg_dumpall globals restore, including
          # inheritance/admin/set options, to catch lost or escalated privileges.
          membership_sql="SELECT coalesce(string_agg(format('%s:%s:%s:%s:%s', member.rolname, granted.rolname, m.admin_option, m.inherit_option, m.set_option), ',' ORDER BY member.rolname, granted.rolname), '') FROM pg_auth_members m JOIN pg_roles member ON member.oid=m.member JOIN pg_roles granted ON granted.oid=m.roleid WHERE member.rolname IN ('merchant_auth','merchant_runtime')"
          source_memberships="$(docker exec "$source_container" psql -X -U postgres -d postgres -Atc "$membership_sql")"
          target_memberships="$(docker exec "$target_container" psql -X -U postgres -d postgres -Atc "$membership_sql")"
          test "$source_memberships" = "$target_memberships" || { echo "SECURITY FAILURE: independent cluster service-role memberships differ"; exit 1; }
          # The service roles must not inherit other roles: a matching but
          # overprivileged source cluster is not a safe recovery baseline.
          test -z "$source_memberships" || { echo "SECURITY FAILURE: service roles have unexpected role memberships"; exit 1; }
          for role in merchant_auth merchant_runtime; do
            source_role="$(docker exec "$source_container" psql -X -U postgres -d postgres -Atc "SELECT concat_ws(':', rolcanlogin, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole, rolreplication, rolinherit) FROM pg_roles WHERE rolname='$role'")"
            target_role="$(docker exec "$target_container" psql -X -U postgres -d postgres -Atc "SELECT concat_ws(':', rolcanlogin, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole, rolreplication, rolinherit) FROM pg_roles WHERE rolname='$role'")"
            test -n "$source_role" && test "$source_role" = "$target_role" || { echo "SECURITY FAILURE: independent cluster role mismatch: $role"; exit 1; }
            # Matching source and target roles may both be overprivileged.
            # Check the dangerous attributes explicitly, without assuming
            # LOGIN or INHERIT defaults for these service roles.
            for cluster in "$source_container" "$target_container"; do
              elevated="$(docker exec "$cluster" psql -X -U postgres -d postgres -Atc "SELECT rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole OR rolreplication FROM pg_roles WHERE rolname='$role'")"
              test "$elevated" = f || { echo "SECURITY FAILURE: elevated service role: $role"; exit 1; }
            done
          done
          for sql in \
            "SELECT relrowsecurity FROM pg_class WHERE oid='ms.research_candidates'::regclass" \
            "SELECT NOT has_function_privilege('merchant_runtime', 'ms.login_account(text,uuid)', 'EXECUTE')" \
            "SELECT NOT has_function_privilege('merchant_runtime', 'ms.lookup_session(bytea)', 'EXECUTE')" \
            "SELECT has_function_privilege('merchant_auth', 'ms.login_account(text,uuid)', 'EXECUTE')" \
            "SELECT has_function_privilege('merchant_auth', 'ms.lookup_session(bytea)', 'EXECUTE')" \
            "SELECT NOT has_function_privilege('PUBLIC', 'ms.login_account(text,uuid)', 'EXECUTE')" \
            "SELECT NOT has_function_privilege('PUBLIC', 'ms.lookup_session(bytea)', 'EXECUTE')"; do
            for cluster_db in "$source_container:merchantscope_test" "$target_container:merchantscope_restore"; do
              IFS=: read -r cluster database <<< "$cluster_db"
              actual="$(docker exec "$cluster" psql -X -U postgres -d "$database" -Atc "$sql")"
              test "$actual" = t || { echo "SECURITY FAILURE: independent cluster RLS/auth privilege check failed in $database"; exit 1; }
            done
          done
          # Compare and enforce the full SECURITY DEFINER execution boundary on
          # both clusters. Checking only two authentication routines misses newly
          # introduced privileged functions with accidental PUBLIC/runtime grants.
          definer_public_sql="SELECT coalesce(string_agg(p.oid::regprocedure::text, ',' ORDER BY p.oid::regprocedure::text), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prosecdef AND has_function_privilege('PUBLIC', p.oid, 'EXECUTE')"
          definer_runtime_sql="SELECT coalesce(string_agg(p.oid::regprocedure::text, ',' ORDER BY p.oid::regprocedure::text), '') FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='ms' AND p.prosecdef AND has_function_privilege('merchant_runtime', p.oid, 'EXECUTE')"
          for cluster_db in "$source_container:merchantscope_test" "$target_container:merchantscope_restore"; do
            IFS=: read -r cluster database <<< "$cluster_db"
            exposed="$(docker exec "$cluster" psql -X -U postgres -d "$database" -Atc "$definer_public_sql")"
            test -z "$exposed" || { echo "SECURITY FAILURE: independent cluster PUBLIC SECURITY DEFINER exposure: $exposed"; exit 1; }
            allowed="$(docker exec "$cluster" psql -X -U postgres -d "$database" -Atc "$definer_runtime_sql")"
            test "$allowed" = "ms.has_role(ms.member_role),ms.is_member()" || { echo "SECURITY FAILURE: independent cluster runtime SECURITY DEFINER allowlist drift: $allowed"; exit 1; }
          done
          # Independent recovery must preserve active audit and guard triggers,
          # not merely rows, RLS policies and SECURITY DEFINER grants.
          # Compare full non-internal trigger inventory, definitions and enablement.
          trigger_catalog_sql="SELECT coalesce(string_agg(format('%s:%s:%s:%s', c.relname, t.tgname, t.tgenabled, pg_get_triggerdef(t.oid)), E'\\n' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal"
          source_triggers="$(docker exec "$source_container" psql -X -U postgres -d merchantscope_test -Atc "$trigger_catalog_sql")"
          target_triggers="$(docker exec "$target_container" psql -X -U postgres -d merchantscope_restore -Atc "$trigger_catalog_sql")"
          test -n "$source_triggers" && test "$source_triggers" = "$target_triggers" || { echo "SECURITY FAILURE: independent cluster trigger catalog differs"; exit 1; }
          # Parity alone is insufficient if both source and restore are insecure.
          # Enforce the migration-defined audit/guard trigger bindings and events.
          trigger_safety_sql="SELECT coalesce(string_agg(c.relname || ':' || t.tgname || ':' || t.tgtype::text || ':' || t.tgenabled, ',' ORDER BY c.relname, t.tgname), '') FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='ms' AND NOT t.tgisinternal AND (t.tgname LIKE 'audit_%' OR t.tgname IN ('recommendations_guard','leads_guard','candidate_guard'))"
          expected_safe_triggers="assessments:audit_assessments:29:O,channels:audit_channels:29:O,evidence:audit_evidence:29:O,leads:audit_leads:29:O,leads:leads_guard:23:O,merchants:audit_merchants:29:O,recommendation_evidence:audit_recommendation_evidence:29:O,recommendations:audit_recommendations:29:O,recommendations:recommendations_guard:23:O,research_candidates:audit_candidates:21:O,research_candidates:candidate_guard:23:O"
          for cluster_db in "$source_container:merchantscope_test" "$target_container:merchantscope_restore"; do
            IFS=: read -r cluster database <<< "$cluster_db"
            safe_triggers="$(docker exec "$cluster" psql -X -U postgres -d "$database" -Atc "$trigger_safety_sql")"
            test "$safe_triggers" = "$expected_safe_triggers" || { echo "SECURITY FAILURE: independent recovery audit/guard trigger enforcement drift in $database"; exit 1; }
          done
          echo "PASS: disposable independent PostgreSQL cluster roles, schema, RLS and auth grants."

      - name: Upload secure synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchantscope-secure-ui
          path: secure-ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7

